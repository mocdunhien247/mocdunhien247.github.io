<!-- ================================================== -->
<!-- 1. MỤC BÌNH LUẬN (Dùng Utterances hoặc Disqus) -->
<!-- ================================================== -->
<section id="comments-section" style="max-width: 800px; margin: 40px auto; padding: 20px;">
    <h3 style="border-bottom: 2px solid #007bff; padding-bottom: 8px;">💬 Bình luận & Thắc mắc</h3>
    
    <!-- Nhúng Utterances (Bình luận lưu vào GitHub Issues) -->
    <!-- Thay 'ten-user-github/ten-repo' bằng repo GitHub của bạn -->
    <script src="https://utteranc.es/client.js"
            repo="mocdunhien247/mocdunhien247.github.io"
            issue-term="pathname"
            label="comment"
            theme="github-light"
            crossorigin="anonymous"
            async>
    </script>
</section>


<!-- ================================================== -->
<!-- 2. NÚT NHẮN TIN TRỰC TIẾP (NỔI Ở GÓC DƯỚI BÊN PHẢI) -->
<!-- ================================================== -->
<div class="chat-widget">
    <!-- Nút Zalo (Thay 0123456789 bằng SĐT Zalo của bạn) -->
    <a href="https://zalo.me/0123456789" target="_blank" class="chat-btn zalo-btn" title="Chat qua Zalo">
        <span>Zalo</span>
    </a>

    <!-- Nút Messenger (Thay your-facebook-username bằng Fanpage/Trang cá nhân Messenger) -->
    <a href="https://m.me/your-facebook-username" target="_blank" class="chat-btn messenger-btn" title="Chat qua Messenger">
        <span>Messenger</span>
    </a>
</div>

<!-- Styling cho nút nhắn tin -->
<style>
.chat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
}

.chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s, box-shadow 0.2s;
}

.chat-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
}

.zalo-btn {
    background-color: #0088FF;
}

.messenger-btn {
    background-color: #0084FF;
    background: linear-gradient(45deg, #0084FF, #A033FF);
}
</style>
